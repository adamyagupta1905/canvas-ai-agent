<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif">
  <title>Agents and tools</title>
  <desc>A router picks one of four agents. Each agent can call only its own deterministic Python tools, which read the core modules. The answer is checked by Python: every number must appear in a tool result.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 700; }
      .s { font-size: 12px; }
      .tool { font-size: 12.5px; font-family: Menlo, Consolas, monospace; fill: #085041; }
      .arr { stroke: #888780; stroke-width: 1.3; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2C2C2A">Agents and the tools they can call</text>
  <text x="600" y="56" text-anchor="middle" font-size="12" fill="#5F5E5A">One LLM adapter (Gemini default, Claude via LLM_PROVIDER) · max 5 tool steps per agent · each agent sees only its own tools</text>

  <!-- question + router -->
  <rect x="470" y="78" width="260" height="40" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="600" y="103" text-anchor="middle" class="t" fill="#2C2C2A">Your question</text>
  <line x1="600" y1="118" x2="600" y2="138" class="arr" marker-end="url(#a)"/>
  <rect x="440" y="140" width="320" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
  <text x="600" y="163" text-anchor="middle" class="t" fill="#712B13">Router (LLM, structured output)</text>
  <text x="600" y="182" text-anchor="middle" class="s" fill="#993C1D">picks one agent + extracts the course code</text>

  <!-- fan out -->
  <g class="arr" marker-end="url(#a)">
    <path d="M600 196 L600 214 L160 214 L160 236"/>
    <path d="M600 214 L450 214 L450 236"/>
    <path d="M600 214 L750 214 L750 236"/>
    <path d="M600 214 L1040 214 L1040 236"/>
  </g>

  <!-- agents -->
  <g fill="#EEEDFE" stroke="#534AB7" stroke-width="1">
    <rect x="30" y="238" width="260" height="64" rx="8"/><rect x="320" y="238" width="260" height="64" rx="8"/>
    <rect x="620" y="238" width="260" height="64" rx="8"/><rect x="910" y="238" width="260" height="64" rx="8"/>
  </g>
  <g fill="#3C3489">
    <text x="160" y="264" text-anchor="middle" class="t">Grades agent</text>
    <text x="160" y="284" text-anchor="middle" class="s" fill="#534AB7">grade, targets, missing marks</text>
    <text x="450" y="264" text-anchor="middle" class="t">Planner agent</text>
    <text x="450" y="284" text-anchor="middle" class="s" fill="#534AB7">progress, deadlines, plan</text>
    <text x="750" y="264" text-anchor="middle" class="t">Content agent</text>
    <text x="750" y="284" text-anchor="middle" class="s" fill="#534AB7">notes, where a topic is covered</text>
    <text x="1040" y="264" text-anchor="middle" class="t">Rules agent</text>
    <text x="1040" y="284" text-anchor="middle" class="s" fill="#534AB7">syllabus rules, attendance</text>
  </g>
  <g class="arr" marker-end="url(#a)">
    <line x1="160" y1="302" x2="160" y2="322"/><line x1="450" y1="302" x2="450" y2="322"/>
    <line x1="750" y1="302" x2="750" y2="322"/><line x1="1040" y1="302" x2="1040" y2="322"/>
  </g>

  <!-- tool boxes -->
  <g fill="#E1F5EE" stroke="#0F6E56" stroke-width="1">
    <rect x="30" y="324" width="260" height="168" rx="8"/><rect x="320" y="324" width="260" height="168" rx="8"/>
    <rect x="620" y="324" width="260" height="168" rx="8"/><rect x="910" y="324" width="260" height="168" rx="8"/>
  </g>
  <g>
    <text x="48" y="352" class="tool">course_grade</text>
    <text x="48" y="378" class="tool">component_breakdown</text>
    <text x="48" y="404" class="tool">needed_for_target</text>
    <text x="48" y="430" class="tool">prairielearn_status</text>
    <text x="48" y="456" class="tool">input_requests</text>
    <text x="48" y="482" class="tool">list_courses</text>

    <text x="338" y="352" class="tool">course_progress</text>
    <text x="338" y="378" class="tool">deadlines</text>
    <text x="338" y="404" class="tool">study_plan</text>
    <text x="338" y="430" class="tool">exam_dates</text>
    <text x="338" y="456" class="tool">list_courses</text>

    <text x="638" y="352" class="tool">course_notes</text>
    <text x="638" y="378" class="tool">search_course_content</text>
    <text x="638" y="404" class="tool">course_schedule</text>
    <text x="638" y="430" class="tool">study_focus</text>
    <text x="638" y="456" class="tool">list_courses</text>

    <text x="928" y="352" class="tool">syllabus_rules</text>
    <text x="928" y="378" class="tool">attendance_status</text>
    <text x="928" y="404" class="tool">component_breakdown</text>
    <text x="928" y="430" class="tool">list_courses</text>
  </g>

  <!-- tools read the core -->
  <g class="arr" marker-end="url(#a)">
    <line x1="160" y1="492" x2="160" y2="536"/><line x1="450" y1="492" x2="450" y2="536"/>
    <line x1="750" y1="492" x2="750" y2="536"/><line x1="1040" y1="492" x2="1040" y2="536"/>
  </g>
  <rect x="30" y="538" width="1140" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-dasharray="4 3"/>
  <text x="600" y="564" text-anchor="middle" class="t" fill="#2C2C2A">Deterministic core (read-only for agents)</text>
  <text x="600" y="586" text-anchor="middle" class="s" fill="#5F5E5A">grades.py · component_check.py · course_view.py · prairielearn.py · website.search · user_inputs.py, reading local data in data/</text>

  <!-- answer + check -->
  <line x1="600" y1="608" x2="600" y2="632" class="arr" marker-end="url(#a)"/>
  <rect x="300" y="634" width="600" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="600" y="660" text-anchor="middle" class="t" fill="#0C447C">Answer, then Python check</text>
  <text x="600" y="680" text-anchor="middle" class="s" fill="#185FA5">every number in the answer must appear in a tool result; anything else is flagged as ungrounded</text>

  <text x="30" y="732" font-size="12" fill="#5F5E5A">Same tools power the dashboard tabs: Overview/Grades (grades agent tools), Plan/Deadlines (planner), Notes/Sources (content), rules per component (rules).</text>
</svg>
